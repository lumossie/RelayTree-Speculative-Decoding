<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">RelayTree: split the draft tree, send prefix tokens, replay in the cloud</title>
  <desc id="desc">An edge SLM drafts a prefix subtree up to split depth s. Prefix token IDs cross the uplink. A cloud-side SLM replica reconstructs the state through replay, completes the draft tree, and the target LLM verifies candidates. Accepted tokens extend the sequence for the next iteration.</desc>
  <rect width="1200" height="640" rx="22" fill="#ffffff"/>
  <g font-family="sans-serif">
    <text x="40" y="49" font-size="29" font-weight="700" fill="#14263d">RelayTree</text>
    <text x="40" y="82" font-size="19" fill="#526377">Split the draft tree across the edge and cloud.</text>

    <rect x="40" y="112" width="330" height="412" rx="18" fill="#eff6ff" stroke="#c8d9f0" stroke-width="1.5"/>
    <text x="64" y="146" font-size="14" font-weight="700" letter-spacing="1.6" fill="#285bad">EDGE</text>
    <circle cx="78" cy="182" r="14" fill="#285bad"/>
    <text x="78" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="102" y="189" font-size="22" font-weight="700" fill="#14263d">Draft the prefix</text>
    <text x="64" y="219" font-size="18" fill="#526377">Small language model</text>

    <g stroke="#285bad" stroke-width="3" fill="none">
      <path d="M205 262 L115 316 M205 262 L205 316 M205 262 L295 316"/>
      <path d="M115 316 L115 369 M205 316 L205 369 M295 316 L295 369"/>
    </g>
    <g fill="#ffffff" stroke="#285bad" stroke-width="3">
      <circle cx="205" cy="262" r="12"/>
      <circle cx="115" cy="316" r="12"/><circle cx="205" cy="316" r="12"/><circle cx="295" cy="316" r="12"/>
      <circle cx="115" cy="369" r="12"/><circle cx="205" cy="369" r="12"/><circle cx="295" cy="369" r="12"/>
    </g>
    <path d="M66 404 H344" stroke="#9db4d3" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="205" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#285bad">Stop at split depth s</text>
    <text x="205" y="477" text-anchor="middle" font-size="16" fill="#526377">Illustrative prefix subtree</text>

    <rect x="400" y="112" width="250" height="412" rx="18" fill="#f8fafc" stroke="#d9e1e9" stroke-width="1.5"/>
    <text x="424" y="146" font-size="14" font-weight="700" letter-spacing="1.6" fill="#526377">UPLINK</text>
    <circle cx="438" cy="182" r="14" fill="#526377"/>
    <text x="438" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="462" y="189" font-size="22" font-weight="700" fill="#14263d">Send tokens</text>
    <text x="424" y="219" font-size="18" fill="#526377">Prefix token IDs only</text>
    <g fill="#ffffff" stroke="#94a8bf" stroke-width="1.5">
      <rect x="423" y="277" width="56" height="52" rx="10"/>
      <rect x="487" y="277" width="56" height="52" rx="10"/>
      <rect x="551" y="277" width="56" height="52" rx="10"/>
    </g>
    <g font-size="19" font-weight="700" fill="#34516e" text-anchor="middle">
      <text x="451" y="310">t₁</text><text x="515" y="310">t₂</text><text x="579" y="310">t₃</text>
    </g>
    <text x="617" y="311" font-size="20" fill="#526377">…</text>
    <text x="525" y="392" text-anchor="middle" font-size="17" fill="#526377">Compact payload across</text>
    <text x="525" y="418" text-anchor="middle" font-size="17" fill="#526377">the edge-cloud link</text>

    <g fill="#526377" stroke="#526377" stroke-width="2.5">
      <path d="M371 303 H394" fill="none"/><path d="M390 298 L397 303 L390 308" stroke="none"/>
      <path d="M651 303 H674" fill="none"/><path d="M670 298 L677 303 L670 308" stroke="none"/>
    </g>

    <rect x="680" y="112" width="480" height="412" rx="18" fill="#edf8f6" stroke="#bdded7" stroke-width="1.5"/>
    <text x="704" y="146" font-size="14" font-weight="700" letter-spacing="1.6" fill="#176c61">CLOUD</text>
    <text x="704" y="179" font-size="18" fill="#526377">SLM replica + target LLM</text>

    <rect x="704" y="202" width="432" height="78" rx="12" fill="#ffffff" stroke="#bdded7"/>
    <circle cx="734" cy="232" r="14" fill="#176c61"/>
    <text x="734" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="760" y="238" font-size="21" font-weight="700" fill="#14263d">Replay the prefix</text>
    <text x="760" y="263" font-size="16" fill="#526377">Reconstruct the SLM state</text>
    <path d="M920 281 V296" stroke="#176c61" stroke-width="2"/>
    <path d="M915 291 L920 299 L925 291" fill="#176c61"/>

    <rect x="704" y="302" width="432" height="78" rx="12" fill="#ffffff" stroke="#bdded7"/>
    <circle cx="734" cy="332" r="14" fill="#176c61"/>
    <text x="734" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="760" y="338" font-size="21" font-weight="700" fill="#14263d">Complete the draft tree</text>
    <text x="760" y="363" font-size="16" fill="#526377">Generate the remaining branches</text>
    <path d="M920 381 V396" stroke="#176c61" stroke-width="2"/>
    <path d="M915 391 L920 399 L925 391" fill="#176c61"/>

    <rect x="704" y="402" width="432" height="78" rx="12" fill="#ffffff" stroke="#bdded7"/>
    <circle cx="734" cy="432" r="14" fill="#176c61"/>
    <text x="734" y="437" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
    <text x="760" y="438" font-size="21" font-weight="700" fill="#14263d">Verify with the target LLM</text>
    <text x="760" y="463" font-size="16" fill="#526377">Accept tokens and extend the sequence</text>

    <path d="M920 524 V552 H205 V531" fill="none" stroke="#8a9bae" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M200 537 L205 528 L210 537" fill="#8a9bae"/>
    <rect x="378" y="538" width="370" height="28" rx="14" fill="#ffffff"/>
    <text x="563" y="558" text-anchor="middle" font-size="16" fill="#526377">Continue with the extended sequence</text>
    <text x="40" y="610" font-size="15" fill="#697b8e">Conceptual overview of the relay scheme. Tree shape and split depth are configurable.</text>
  </g>
</svg>
